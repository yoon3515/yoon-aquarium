<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" />
  <meta name="theme-color" content="#071a20" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="나의 아쿠아리움" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>나의 작은 아쿠아리움</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">HEALING AQUARIUM · MVP</p><h1>나의 작은 아쿠아리움</h1></div><div class="stats"><span>🫧 <b id="cleanValue">92</b>%</span><span>💙 <b id="moodValue">78</b>%</span></div></header>
    <section class="tank-shell" aria-label="수조"><div class="tank" id="tank"><div class="water-light"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div><div class="bubble b5"></div><div class="plant plant-a"></div><div class="plant plant-b"></div><div class="fish-wrap" id="fishWrap" aria-label="베타"><div class="fish" id="fish"></div></div><div class="food-layer" id="foodLayer"></div><div class="substrate" id="substrate"></div><div class="glass"></div></div><div class="zoom-controls"><button id="zoomOut" aria-label="축소">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">＋</button></div></section>
    <section class="pet-card"><div><span class="badge">첫 번째 친구</span><h2>루비 · 베타</h2><p id="statusText">천천히 수조를 구경하고 있어요.</p></div><div class="meters"><label>포만감 <progress id="hungerBar" value="74" max="100"></progress></label><label>기분 <progress id="moodBar" value="78" max="100"></progress></label></div></section>
    <nav class="actions" aria-label="게임 행동"><button id="feedBtn"><span>🍽️</span>먹이 주기</button><button id="cleanBtn"><span>🧽</span>청소하기</button><button id="watchBtn"><span>🔎</span>가까이 보기</button></nav>
    <section class="customize"><h3>수조 꾸미기</h3><div class="chips"><button class="chip active" data-gravel="natural">내추럴 믹스</button><button class="chip" data-gravel="white">화이트</button><button class="chip" data-gravel="black">블랙</button></div><p class="hint">모바일에서는 수조를 두 손가락으로 확대/축소할 수 있어요. 설정은 브라우저에 자동 저장됩니다.</p></section>
  </main><div class="toast" id="toast" role="status"></div><script src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body></html>
