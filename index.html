<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#071a20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>나의 작은 아쿠아리움</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 0,#174752,#071a20 45%,#041014);color:#eff;min-height:100vh}.app{max-width:860px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.top h1{font-size:clamp(22px,6vw,34px);margin:4px 0 12px}.ey{font-size:11px;color:#83ded5;letter-spacing:.13em}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stats span{background:#ffffff14;border:1px solid #ffffff1b;border-radius:999px;padding:7px 9px;font-size:12px}.shell{position:relative}.tank{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:28px 28px 42px 42px;background:linear-gradient(#8fe6e935,#177e8a88 52%,#0d4d58);box-shadow:inset 0 0 0 2px #cfffff55,inset 0 0 40px #bfffff18,0 22px 50px #0008;transform-origin:center;touch-action:none}.light{position:absolute;inset:0;background:radial-gradient(ellipse at 42% 4%,#fff5,transparent 32%),linear-gradient(105deg,transparent 20%,#fff1 37%,transparent 52%)}.sand{position:absolute;left:-4%;right:-4%;bottom:-2%;height:19%;border-radius:50% 50% 0 0/30% 30% 0 0;background:radial-gradient(circle at 10px 8px,#d7c39b 0 2px,transparent 2.4px),radial-gradient(circle at 22px 18px,#947d5b 0 2px,transparent 2.5px),#b39a74;background-size:28px 25px}.sand.white{background:radial-gradient(circle at 10px 8px,#fff 0 2px,transparent 2.4px),radial-gradient(circle at 22px 18px,#ddd 0 2px,transparent 2.5px),#e7e4dc;background-size:28px 25px}.sand.black{background:radial-gradient(circle at 10px 8px,#555 0 2px,transparent 2.4px),radial-gradient(circle at 22px 18px,#111 0 2px,transparent 2.5px),#24282a;background-size:28px 25px}.plant{position:absolute;bottom:15%;width:9px;height:35%;background:#1f785f;border-radius:50% 50% 10px 10px;transform-origin:bottom;box-shadow:18px 18px 0 -2px #3a946d,-16px 28px 0 -2px #2d8065}.p1{left:10%;transform:rotate(-8deg)}.p2{right:10%;height:30%;transform:rotate(10deg)}.fishwrap{position:absolute;left:38%;top:38%;width:27%;aspect-ratio:1.7;will-change:transform}.fish{position:absolute;left:18%;top:22%;width:55%;height:48%;background:linear-gradient(90deg,#a40d21,#f04d38 50%,#8e0820);border-radius:50% 46% 46% 50%;box-shadow:0 8px 15px #0018}.fish:before{content:"";position:absolute;left:-40%;top:-25%;width:65%;height:150%;background:radial-gradient(ellipse at 70% 50%,#f65a54 0 28%,#8c0c2c 52%,transparent 54%);clip-path:polygon(100% 50%,0 0,18% 48%,0 100%)}.fish:after{content:"";position:absolute;right:14%;top:28%;width:5px;height:5px;border-radius:50%;background:#111;box-shadow:0 0 0 1px #fff8}.bubble{position:absolute;border:1px solid #dfffffaa;border-radius:50%;animation:rise 7s linear infinite}.b1{width:10px;height:10px;left:20%;bottom:10%}.b2{width:6px;height:6px;left:67%;bottom:14%;animation-delay:-3s}.b3{width:13px;height:13px;left:75%;bottom:8%;animation-delay:-5s}@keyframes rise{to{transform:translateY(-55vh);opacity:0}}.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;align-items:center;background:#001015b8;padding:5px;border-radius:999px}.zoom button{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:20px}.zoom span{min-width:48px;text-align:center;font-size:12px}.card{margin-top:14px;border:1px solid #ffffff18;background:#ffffff0c;border-radius:20px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{margin:4px 0}.card p{margin:0;color:#a9c7c8;font-size:13px}.meters{display:grid;gap:8px;align-content:center}.meters label{font-size:12px;color:#bcd}.meters progress{width:100%;accent-color:#73d8cc}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.actions button,.chip{border:1px solid #ffffff1c;background:#ffffff0d;color:white;border-radius:16px;padding:12px 8px}.actions span{display:block;font-size:22px}.custom{margin-top:16px}.chips{display:flex;gap:8px;overflow:auto}.chip{white-space:nowrap;padding:9px 12px;border-radius:999px;font-size:12px}.chip.active{background:#86e2d7;color:#072125}.hint{font-size:12px;color:#78999b;line-height:1.5}.food{position:absolute;width:6px;height:6px;border-radius:50%;background:#d9a15d;top:8%;animation:fall 3s ease-in forwards}@keyframes fall{to{top:65%;opacity:.15}}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:#effffb;color:#062027;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.tank{aspect-ratio:4/5}.fishwrap{width:38%;left:31%;top:40%}.card{grid-template-columns:1fr}.actions button{font-size:12px}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}}</style></head><body><main class="app"><header class="top"><div><div class="ey">HEALING AQUARIUM · MOBILE MVP</div><h1>나의 작은 아쿠아리움</h1></div><div class="stats"><span>🫧 <b id="clean">92</b>%</span><span>💙 <b id="mood">78</b>%</span></div></header><section class="shell"><div class="tank" id="tank"><div class="light"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="plant p1"></div><div class="plant p2"></div><div class="fishwrap" id="fish"><div class="fish"></div></div><div id="food"></div><div class="sand" id="sand"></div></div><div class="zoom"><button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">＋</button></div></section><section class="card"><div><small style="color:#7ee0d5">첫 번째 친구</small><h2>루비 · 베타</h2><p id="status">천천히 수조를 구경하고 있어요.</p></div><div class="meters"><label>포만감 <progress id="hungerBar" max="100" value="74"></progress></label><label>기분 <progress id="moodBar" max="100" value="78"></progress></label></div></section><nav class="actions"><button id="feedBtn"><span>🍽️</span>먹이 주기</button><button id="cleanBtn"><span>🧽</span>청소하기</button><button id="watchBtn"><span>🔎</span>가까이 보기</button></nav><section class="custom"><h3>수조 꾸미기</h3><div class="chips"><button class="chip active" data-g="natural">내추럴 믹스</button><button class="chip" data-g="white">화이트</button><button class="chip" data-g="black">블랙</button></div><p class="hint">휴대폰에서는 두 손가락 핀치로 확대/축소할 수 있어요. 상태는 브라우저에 자동 저장됩니다.</p></section></main><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),tank=$('#tank'),fish=$('#fish'),toast=$('#toast');let z=+(localStorage.aqz||1),h=+(localStorage.aqh||74),m=+(localStorage.aqm||78),c=+(localStorage.aqc||92),g=localStorage.aqg||'natural',t=0,last=performance.now(),pinch=null;function save(){localStorage.aqz=z;localStorage.aqh=h;localStorage.aqm=m;localStorage.aqc=c;localStorage.aqg=g}function ui(){tank.style.transform=`scale(${z})`;$('#zoomLabel').textContent=Math.round(z*100)+'%';$('#hungerBar').value=h;$('#moodBar').value=m;$('#mood').textContent=Math.round(m);$('#clean').textContent=Math.round(c);$('#sand').className='sand '+(g==='natural'?'':g);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.g===g))}function say(x){toast.textContent=x;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1500)}function zoom(v){z=Math.max(1,Math.min(1.6,v));ui();save()}$('#plus').onclick=()=>zoom(z+.1);$('#minus').onclick=()=>zoom(z-.1);$('#watchBtn').onclick=()=>{zoom(z>1.2?1:1.45);say(z>1.2?'루비를 가까이 보고 있어요 🔎':'전체 수조로 돌아왔어요')};$('#feedBtn').onclick=()=>{for(let i=0;i<7;i++){let f=document.createElement('i');f.className='food';f.style.left=38+Math.random()*26+'%';f.style.animationDelay=Math.random()*.7+'s';$('#food').appendChild(f);setTimeout(()=>f.remove(),3800)}h=Math.min(100,h+15);m=Math.min(100,m+4);$('#status').textContent='루비가 맛있게 먹이를 먹었어요.';say('냠냠! 포만감이 올랐어요 🍽️');ui();save()};$('#cleanBtn').onclick=()=>{c=100;m=Math.min(100,m+6);$('#status').textContent='물이 맑아져서 루비의 기분이 좋아졌어요.';say('수조가 반짝반짝 깨끗해졌어요 ✨');ui();save()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{g=x.dataset.g;say(x.textContent+' 바닥재로 바꿨어요');ui();save()});tank.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});tank.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom(z+(d-pinch)/600);pinch=d}},{passive:true});tank.addEventListener('touchend',()=>pinch=null,{passive:true});function anim(now){let dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;let x=Math.sin(t*.55)*58,y=Math.sin(t*.9)*20,flip=Math.cos(t*.55)<0?-1:1;fish.style.transform=`translate(${x}px,${y}px) scaleX(${flip})`;requestAnimationFrame(anim)}setInterval(()=>{h=Math.max(0,h-.35);c=Math.max(0,c-.12);m=Math.max(20,Math.min(100,m+(h>45&&c>55?.08:-.22)));ui();save()},30000);ui();requestAnimationFrame(anim);</script></body></html>
